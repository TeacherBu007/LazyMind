name: Agent E2E Platform Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-and-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install Pillow==12.0.0 PyYAML==6.0.3
      - name: Verify platform locks, process cleanup, transport and credential boundaries
        run: python -m unittest discover -s scripts/tests -p "test_agent_e2e*.py" -v
